<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <link href="css/layout.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid app-shell">
    <header class="topbar">
      <div><span class="brand-mark">SO</span><span class="brand-name">ServO</span></div>
      <div class="topbar-actions"><button class="notification-button" type="button" aria-label="Notifikasi">♢<span class="notification-dot"></span></button><div class="user-chip"><span class="avatar">ST</span><span><strong id="userInfo" class="d-block small"></strong><span class="role-text">Workspace account</span></span></div><button id="logoutButton" class="btn btn-outline-secondary btn-sm d-none">Keluar</button></div>
    </header>
    <section id="loginView" class="card p-4 mx-auto login-card">
      <h2 class="h5">Login</h2>
      <form id="loginForm">
        <input id="email" class="form-control mb-2" type="email" placeholder="Email" required>
        <input id="password" class="form-control mb-3" type="password" placeholder="Password" required>
        <button class="btn btn-primary w-100">Masuk</button>
      </form>
      <div id="loginError" class="text-danger small mt-3"></div>
    </section>
    <section id="appView" class="d-none">
      <div class="row g-4">
        <aside class="col-lg-2"><nav id="sideNav" class="nav flex-column sidebar"></nav></aside>
        <div class="col-lg-10 main-content"><div class="page-header d-flex justify-content-between align-items-center mb-4"><div><p class="eyebrow mb-1">WORKSPACE</p><h1 id="pageTitle" class="h3 mb-0">Dashboard</h1><div class="breadcrumb mt-1">ServO / Workspace</div></div><button id="newTicketButton" class="btn btn-primary">+ Buat tiket</button></div>
          <div id="flash" class="alert d-none"></div>
          <div id="summary" class="row g-3 mb-4"></div>
          <div class="card panel p-3"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Tiket terbaru</h2><input id="ticketSearch" class="form-control form-control-sm search-input" placeholder="Cari tiket..."></div><div id="ticketList" class="table-responsive"></div></div>
        </div>
      </div>
    </section>
  </main>
  <div class="modal fade" id="ticketModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="ticketForm"><div class="modal-header"><h2 class="modal-title h5">Buat tiket</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label" for="ticketTitle">Judul</label><input id="ticketTitle" class="form-control mb-3" required><label class="form-label" for="ticketDescription">Deskripsi</label><textarea id="ticketDescription" class="form-control mb-3" rows="4" required></textarea><label class="form-label" for="ticketCategory">Category ID</label><input id="ticketCategory" class="form-control mb-3" type="number" required><label class="form-label" for="ticketPriority">Priority ID</label><input id="ticketPriority" class="form-control" type="number" required></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Simpan tiket</button></div></form></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
